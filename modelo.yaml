Primeira_Etapa:
  - Regra_de_Ouro_Ano_Anterior:
      validacao:
        true:
          descricao: Valor previsto dentro dos limites
          proximo_passo: Prosseguir para Regra de Ouro (Ano Atual)
        false:
          descricao: Valor previsto ultrapassa os limites
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [SICONFI]
      base_normativa: Regra de ouro 167, Inciso III, da CF 88 + RSF 43/2001, Pag 78 do MIP
      objetivo: A regra de ouro busca evitar o uso de recursos provenientes de operações de crédito para o pagamento de despesas correntes. Para isto, ela diz que as receitas de operação de crédito não podem ultrapassar as despesas de capital.

  - Regra_de_Ouro_Ano_Atual:
      validacao:
        true:
          descricao: Dentro dos limites
          proximo_passo: Prosseguir para Limite de 16% da Receita Corrente Líquida Estimada.
        false:
          descricao: Ultrapassa os limites
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [SICONFI]
      base_normativa: Regra de ouro 167, Inciso III, da CF 88 + RSF 43/2001, Pag 78 do MIP
      objetivo: A regra de ouro busca evitar o uso de recursos provenientes de operações de crédito para o pagamento de despesas correntes. Para isto, ela diz que as receitas de operação de crédito não podem ultrapassar as despesas de capital.

  - Limite_16_RCL_Estimada:
      validacao:
        true:
          descricao: Em cada exercício, liberações da nova operação + demais liberações incluídas ≤ 16% da RCL projetada; conclusão depende de cronogramas e fontes completos
          proximo_passo: Prosseguir para a Regra do Dispêndio
        false:
          descricao: Liberações anuais incluídas > 16% da RCL projetada em pelo menos um exercício
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [SICONFI]
      base_normativa: Art 7º, Inciso I, da RSF 43/2001, Pag 80 e 81 do MIP
      objetivo: Comparar o montante anual de liberações sujeito ao limite geral com 16% da RCL projetada, em todos os exercícios relevantes.
      projecao_rcl:
        fonte: https://www.tesourotransparente.gov.br/mip
        edicao: "2026.08.21"
        vigencia_inicial: "2026-04-22"
        taxa_decimal: "0.02031208231"
        multiplicador: "1.02031208231"
        primeiro_ano: RCL base × multiplicador^(meses até dezembro / 12)
        anos_seguintes: RCL ano anterior × multiplicador
        observacao: Dezembro do exercício anterior implica 12 meses; dezembro do próprio exercício já representa seu fechamento. Hipóteses alternativas e referências históricas exigem validação.

  - Regra_do_Servico_da_Divida_115_RCL_Estimada:
      validacao:
        true:
          descricao: Média anual mais benéfica do CAED/RCL ≤ 11,5%, com cobertura e fontes completas
          proximo_passo: Prosseguir para a Dívida Consolidada
        false:
          descricao: Médias anuais aplicáveis do CAED/RCL > 11,5%
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [SICONFI]
      base_normativa: RSF 43/2001, art. 7º, II e §4º; MIP 2026.08.21, seções 3.12.9, 4.1.3 e 4.2
      objetivo: Comparar a média simples do CAED (operação pleiteada + demais operações) / RCL projetada nos anos com pagamentos da operação pretendida, usando a alternativa mais benéfica entre término e até 31/12/2027, derivadas do mesmo cronograma.

  - Divida_Consolidada:
      validacao:
        true:
          descricao: Dívida Consolidada ≤ 2x a RCL Estimada
          proximo_passo: Prosseguir para a confrotação total
        false:
          descricao: Dívida Consolidada > 2x a RCL Estimada
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [SICONFI]
      base_normativa: Inciso III do Art 7º, combinado com art 3º da RSF 43/2001, Pag 98 do MIP
      objetivo: Tem o objetivo de evitar o super endividamento

Segunda_Etapa:
  - Limite_de_Garantias:
      validacao:
        true:
          descricao: Garantia ≤ 22% da RCL Estimada
          proximo_passo: Prosseguir para a verificação do valor da operação de crédito
        false:
          descricao: Garantia > 22% da RCL Estimada
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [B.O]
      base_normativa: Art. 9º da RSF 43/2001
      objetivo: Impedir o comprometimento das garantias na RCL

  - Valor_da_Garantia:
      validacao:
        true:
          descricao: Garantia ≥ Valor da operação de crédito pretendida
          proximo_passo: Prosseguir para a confrotação total
        false:
          descricao: Garantia < Valor da operação de crédito pretendida
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [B.O]
      base_normativa: Art. 9º da RSF 43/2003
      objetivo: Impedir o comprometimento das garantias na RCL

Terceira_Etapa:
  - Despesa_com_Pessoal:
      validacao:
        true:
          descricao: Despesa com pessoal ≤ 60% da RCL Estimada
          proximo_passo: Prosseguir para a próxima decisão de despesas correntes
        false:
          descricao: Despesa com pessoal > 60% da RCL Estimada
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [SICONFI]
      base_normativa: Art 19º II, LRF, RSF Nº 43/2001
      objetivo: O excessivo gasto com despesas com pessoal pode comprometer a capacidade de honrar o serviço da dívida, tendo em vista que o gasto com pessoal é uma despesa de caráter continuado.

  - Nota_CAPAG:
      validacao:
        true:
          descricao: NOTA CAPAG SUPERIOR < A OU B
          proximo_passo: Prosseguir para a confrotação total
        false:
          descricao: Nota CAPAG INFERIOR > A OU B
          proximo_passo: Operação de Crédito Negada
      banco_de_dados: [SICONFI, INTERNA]
      base_normativa: MIP, exigível para a concessão de garantias da União. Necessidade do Ente obter CAPAG A OU B
      objetivo: Caso o Ente não tenha a CAPAG apropriada, não poderá contar com a União no oferecimento de garantias, isto levará a um maior nível de risco e taxas de juros no mercado
